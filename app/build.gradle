import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

def signingPropertiesFile = rootProject.file('keystore.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def releaseStoreFile = signingProperties.getProperty('storeFile') ?: System.getenv('STAR_JOURNEY_KEYSTORE')
def releaseStorePassword = signingProperties.getProperty('storePassword') ?: System.getenv('STAR_JOURNEY_STORE_PASSWORD')
def releaseKeyAlias = signingProperties.getProperty('keyAlias') ?: System.getenv('STAR_JOURNEY_KEY_ALIAS')
def releaseKeyPassword = signingProperties.getProperty('keyPassword') ?: System.getenv('STAR_JOURNEY_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { it != null && !it.trim().isEmpty() }
def bundledTestDatabase = providers.gradleProperty('bundledTestDatabase')
def bundledTestVersionCode = providers.gradleProperty('bundledTestVersionCode')
def bundledTestVersionName = providers.gradleProperty('bundledTestVersionName')
def bundledTestAssetsDirectory = layout.buildDirectory.dir('generated/bundledTestAssets')

android {
    namespace 'helper.journey.starsavior'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId 'helper.journey.starsavior'
        minSdk 26
        targetSdk 35
        versionCode 53
        versionName '2.2.2'
        buildConfigField 'boolean', 'BUNDLED_TEST_DATABASE', 'false'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        internal {
            initWith release
            matchingFallbacks = ['release']
            versionNameSuffix '-db-test'
            buildConfigField 'boolean', 'BUNDLED_TEST_DATABASE', 'true'
        }
    }

    sourceSets {
        internal {
            assets.srcDir(bundledTestAssetsDirectory)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED',
                    '--add-opens=java.base/java.net=ALL-UNNAMED',
                    '--add-opens=java.base/java.security=ALL-UNNAMED',
                    '--add-opens=java.base/java.text=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                    '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                    '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

android.applicationVariants.configureEach { variant ->
    if (variant.buildType.name == 'internal') {
        variant.outputs.configureEach { output ->
            if (bundledTestVersionCode.isPresent()) {
                output.versionCodeOverride = bundledTestVersionCode.get().toInteger()
            }
            if (bundledTestVersionName.isPresent()) {
                output.versionNameOverride = bundledTestVersionName.get()
            }
        }
    }
}

dependencies {
    // Bundle script models so the selected language also works offline on first run.
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'org.json:json:20240303'
}

def validateReleaseSigning = tasks.register('validateReleaseSigning') {
    group = 'verification'
    description = 'Checks that release signing credentials are supplied outside the repository.'
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException('Release signing is not configured. Supply a local keystore.properties file or set the STAR_JOURNEY_* environment variables.')
        }
        File keystore = rootProject.file(releaseStoreFile)
        if (!keystore.isFile()) {
            throw new GradleException("Release keystore does not exist: ${keystore}")
        }
    }
}

def validateReleaseDatabaseBoundary = tasks.register('validateReleaseDatabaseBoundary') {
    group = 'verification'
    description = 'Fails if a real journey database could enter the production release source sets.'
    doLast {
        List<File> present = ['src/main/assets', 'src/release/assets'].collectMany { directory ->
            fileTree(directory).matching { include '**/journey_choices.json' }.files.toList()
        }
        if (!present.isEmpty()) {
            throw new GradleException(
                    'Production release must not bundle journey_choices.json: '
                            + present.collect { it.path }.join(', '))
        }
    }
}

def validateBundledTestBuild = tasks.register('validateBundledTestBuild') {
    group = 'verification'
    description = 'Checks the external DB and installable version used by an internal test APK.'
    dependsOn(validateReleaseSigning)
    doLast {
        if (!bundledTestDatabase.isPresent()) {
            throw new GradleException('Supply -PbundledTestDatabase=<external journey_choices.json>.')
        }
        File database = file(bundledTestDatabase.get()).canonicalFile
        if (!database.isFile() && !database.isDirectory()) {
            throw new GradleException("Bundled test database does not exist: ${database}")
        }
        if (database.toPath().startsWith(rootDir.canonicalFile.toPath())) {
            throw new GradleException('Bundled test database must remain outside the public source repository.')
        }
        if (!bundledTestVersionCode.isPresent()) {
            throw new GradleException('Supply -PbundledTestVersionCode=<installable versionCode>.')
        }
        int testVersionCode
        try {
            testVersionCode = bundledTestVersionCode.get().toInteger()
        } catch (NumberFormatException error) {
            throw new GradleException('bundledTestVersionCode must be an integer.', error)
        }
        if (testVersionCode <= android.defaultConfig.versionCode) {
            throw new GradleException(
                    "bundledTestVersionCode must exceed production versionCode ${android.defaultConfig.versionCode}.")
        }
    }
}

def prepareBundledTestDatabase = tasks.register('prepareBundledTestDatabase') {
    group = 'build setup'
    description = 'Validates and stages an external journey DB only in the generated internal assets directory.'
    dependsOn(validateBundledTestBuild)
    inputs.property('databasePath', bundledTestDatabase.orElse(''))
    if (bundledTestDatabase.isPresent()) {
        File input = file(bundledTestDatabase.get())
        if (input.isDirectory()) inputs.files(fileTree(input).matching { include '**/journey_choices.json' })
        else inputs.file(input)
    }
    outputs.dir(bundledTestAssetsDirectory)
    doLast {
        File source = file(bundledTestDatabase.get()).canonicalFile
        List<String> languages = ['ko-KR', 'en-US', 'ja-JP', 'zh-TW', 'zh-CN', 'fr-FR', 'de-DE', 'es-ES', 'pt-BR', 'id-ID', 'vi-VN']
        List<File> databases = source.isFile() ? [source] : fileTree(source).matching {
            include '**/journey_choices.json'
        }.files.sort { it.path }
        if (databases.isEmpty()) throw new GradleException('No test databases found.')
        Map<String, File> byLanguage = [:]
        for (File database : databases) {
            Object parsed = new JsonSlurper().parse(database, 'UTF-8')
            if (!(parsed instanceof Map) || parsed.schema != 5 || !languages.contains(parsed.language)
                    || !(parsed.records instanceof List) || parsed.records.isEmpty()) {
                throw new GradleException('Test DB must be a non-empty schema 5 language DB.')
            }
            if (byLanguage.containsKey(parsed.language)) throw new GradleException('Duplicate test DB language.')
            byLanguage[parsed.language] = database
        }
        // Sync removes stale generated language packs when the input set changes.
        project.sync { spec ->
            spec.into(bundledTestAssetsDirectory)
            byLanguage.each { language, database ->
                spec.from(database) { entry ->
                    entry.into(language)
                    entry.rename { 'journey_choices.json' }
                }
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name in ['assembleRelease', 'packageRelease', 'bundleRelease', 'signReleaseBundle']) {
        task.dependsOn(validateReleaseSigning, validateReleaseDatabaseBoundary)
    }
    if (task.name.contains('Internal')
            && !task.name.startsWith('clean')
            && !task.name.startsWith('uninstall')) {
        task.dependsOn(prepareBundledTestDatabase)
    }
    if (task.name in ['assembleInternal', 'packageInternal', 'bundleInternal']) {
        task.dependsOn(validateBundledTestBuild)
    }
}
