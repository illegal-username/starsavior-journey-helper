name: Temporary unsigned 2.1.3 recovery build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  recovery-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and verify unsigned release
        run: |
          python3 tools/check_public_source.py
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease -x validateReleaseSigning
          mkdir -p recovery-artifact
          cp app/build/outputs/apk/release/app-release-unsigned.apk recovery-artifact/StarSaviorJourneyHelper-v2.1.3-unsigned.apk
          cp app/build/outputs/apk/release/output-metadata.json recovery-artifact/output-metadata.json
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" recovery-artifact/apksigner.jar
          sha256sum recovery-artifact/*
      - name: Upload unsigned recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-2.1.3
          path: recovery-artifact/
          if-no-files-found: error
          retention-days: 1
